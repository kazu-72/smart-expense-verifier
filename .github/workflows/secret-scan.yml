name: Secret scan

on:
  push:
  pull_request:

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install detect-secrets
        run: python -m pip install --upgrade pip && pip install detect-secrets
      - name: Run detect-secrets (fail on findings)
        run: |
          python - <<'PY'
          import json,sys,subprocess
          proc = subprocess.run(['detect-secrets','scan','--all-files','--json'], capture_output=True, text=True)
          out = proc.stdout
          try:
              obj = json.loads(out)
          except Exception:
              print(out)
              sys.exit(0)
          if obj.get('results'):
              print('Potential secrets found:')
              print(json.dumps(obj['results'], indent=2))
              sys.exit(1)
          print('No secrets found')
          PY
